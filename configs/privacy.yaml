# Privacy-Focused Configuration
# Use this config for differential privacy experiments
# Tests privacy-utility tradeoff with DPFedAvg

defaults:
  - default

data:
  partition: "iid"     # Start with IID for privacy baseline
  n_clients: 5
  seed: 42

training:
  local_epochs: 3
  batch_size: 512
  learning_rate: 0.001
  num_rounds: 100      # More rounds for convergence with noise

strategy:
  name: "dpfedavg"
  
  # Differential Privacy parameters
  max_grad_norm: 1.0          # Clipping threshold
  noise_multiplier: 0.1       # Noise std / clipping (increase for stronger privacy)
  target_delta: 1e-5          # Target delta for RDP accounting
  
  # FedNova style parameters (unused for DP)
  momentum: 0.0
  adapt_lr: true

experiment:
  name: "privacy_dpfedavg"
  description: "DPFedAvg with differential privacy (noise_multiplier=0.1)"
  verbose: true
